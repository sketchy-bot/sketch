<html><head><script>window.Sketch=window.Sketch||{};Sketch.TabBehavior={created:function(){this._trackTabOpen();window.addEventListener("beforeunload",this._trackTabClose.bind(this))},properties:{rememberTab:{type:Boolean,value:!1}},_trackTabOpen:function(){if(!window.tabID){var tabs=JSON.parse(localStorage.getItem("tabs")||"{}");window.tabID=-1;for(var id in tabs){if(!tabs[id]){window.tabID=id;break}}if(-1==window.tabID){window.tabID=0;while(tabs[window.tabID]){window.tabID++}}tabs[window.tabID]=!0;localStorage.setItem("tabs",JSON.stringify(tabs))}},_trackTabClose:function(){var tabs=JSON.parse(localStorage.getItem("tabs")||"{}");if(this.rememberTab){tabs[window.tabID]=!1}else{delete tabs[window.tabID]}localStorage.setItem("tabs",JSON.stringify(tabs))}};</script></head><body></body></html>
