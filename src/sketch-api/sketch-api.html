<html><head><link rel="import" href="../../bower_components/polymer/polymer.html"><link rel="import" href="../../bower_components/iron-ajax/iron-ajax.html"></head><body><dom-module id="sketch-api"><template><iron-ajax id="getStatsRequest" url="https://noz.rip/sketch/getStats.php?timespan=300" handle-as="text" on-response="_onGetStats"></iron-ajax><iron-ajax id="getMaxIDRequest" url="https://noz.rip/sketch/getMaxID.php" handle-as="text" on-response="_onSwap"></iron-ajax><iron-ajax id="swapRequest" url="https://noz.rip/sketch/swap.php?v=32" method="POST" handle-as="text" on-response="_onSwap"></iron-ajax><iron-ajax id="getRequest" url="https://noz.rip/sketch/get.php" handle-as="text" on-response="_onGet"></iron-ajax></template><script>(function(){var GET_STATS_INTERVAL=1e4,GET_INTERVAL=3e3;Polymer({is:"sketch-api",ready:function(){this._getStats();setInterval(this._getStats.bind(this),GET_STATS_INTERVAL)},// Public properties
properties:{loading:{type:Boolean,value:!1,notify:!0,readOnly:!0},sketches:{type:Number,value:-1,notify:!0,readOnly:!0},artists:{type:Number,value:-1,notify:!0,readOnly:!0},peekers:{type:Number,value:-1,notify:!0,readOnly:!0}},// Public functions
